<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalkulator Biner ke Desimal</title>
    <!-- Link ke CSS Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="card-header">
    <a href="dashboard.html"> kembali</a>   
    </div>
    <div class="container mt-5">
      <div class="card">
        <div class="card-header text-center">
          <h3>Kalkulator Biner ke Desimal</h3>
        </div>
        <div class="card-body">
          <form id="binaryForm">
            <div class="mb-3">
              <label for="binaryInput" class="form-label">Masukkan Angka Biner:</label>
              <input
                type="text"
                class="form-control"
                id="binaryInput"
                placeholder="Contoh: 1010"
              />
            </div>
            <button type="submit" class="btn btn-primary">Konversi</button>
          </form>
          <div class="mt-3">
            <h4>Hasil Desimal:</h4>
            <p id="decimalResult" class="alert alert-info"></p>
          </div>
        </div>
      </div>
    </div>

    <!-- Script JavaScript untuk menangani konversi -->
    <script>
      document
        .getElementById("binaryForm")
        .addEventListener("submit", function (event) {
          event.preventDefault(); // Mencegah form submit reload halaman

          var binaryValue = document.getElementById("binaryInput").value;

          // Mengecek apakah input adalah angka biner yang valid
          if (/^[01]+$/.test(binaryValue) === false) {
            alert("Silakan masukkan angka biner yang valid (hanya 0 dan 1).");
            return;
          }

          // Mengonversi biner ke desimal
          var decimalValue = parseInt(binaryValue, 2);

          // Menampilkan hasil desimal
          document.getElementById("decimalResult").textContent =
            "Desimal: " + decimalValue;
        });
    </script>

    <!-- Link ke JS Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
