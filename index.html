<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kalkulator Desimal ke Biner</title>
    <!-- Link ke CSS Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container mt-20">
      <div class="card">
        <div class="card-header text-center">
          <h3>Kalkulator Desimal ke Biner</h3>
        </div>
        <div class="card-body">
          <form id="decimalForm">
            <div class="mb-3">
              <label for="decimalInput" class="form-label"
                >Masukkan Angka Desimal:</label
              >
              <input
                type="number"
                class="form-control"
                id="decimalInput"
                placeholder="Contoh: 10"
              />
            </div>
            <button type="submit" class="btn btn-primary">Konversi</button>
          </form>
          <div class="mt-3">
            <h4>Hasil Biner:</h4>
            <p id="binaryResult" class="alert alert-info"></p>
          </div>
          <a href="class="></a>
        </div>
      </div>
    </div>

    <!-- Script JavaScript untuk menangani konversi -->
    <script>
      document
        .getElementById("decimalForm")
        .addEventListener("submit", function (event) {
          event.preventDefault(); // Mencegah form submit reload halaman

          var decimalValue = document.getElementById("decimalInput").value;

          // Mengecek apakah input adalah angka yang valid
          if (decimalValue === "" || isNaN(decimalValue)) {
            alert("Silakan masukkan angka desimal yang valid.");
            return;
          }

          // Mengonversi desimal ke biner
          var binaryValue = parseInt(decimalValue, 10).toString(2);

          // Menampilkan hasil biner
          document.getElementById("binaryResult").textContent =
            "Biner: " + binaryValue;
        });
    </script>

    <!-- Link ke JS Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
